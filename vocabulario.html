
<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flashcards de Inglês</title>

<style>

/* =====================================================
   CONFIGURAÇÕES
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;

    font-family: Arial, Helvetica, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;

    background: #07345d;
}


/* =====================================================
   FUNDO
===================================================== */

.background {
    position: fixed;
    inset: 0;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 20% 25%,
            #16517d,
            transparent 28%
        ),

        radial-gradient(
            circle at 80% 70%,
            #12466f,
            transparent 30%
        ),

        #07345d;
}


/* =====================================================
   BRILHOS
===================================================== */

.glow {
    position: absolute;

    width: 280px;
    height: 280px;

    border-radius: 50%;

    background: rgba(76,180,240,.13);

    filter: blur(60px);

    animation: glowMove 6s infinite alternate;
}

.glow1 {
    top: -120px;
    left: -80px;
}

.glow2 {
    right: -120px;
    bottom: -80px;

    animation-delay: 2s;
}

.glow3 {
    left: 45%;
    top: 40%;

    animation-delay: 4s;
}

@keyframes glowMove {

    from {
        transform: scale(.8);
        opacity: .4;
    }

    to {
        transform: scale(1.3);
        opacity: .8;
    }
}


/* =====================================================
   NEURÔNIOS
===================================================== */

.neuron {
    position: absolute;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #8bd4ff;

    box-shadow:
        0 0 10px #8bd4ff,
        0 0 20px rgba(100,200,255,.7);

    animation: pulse 3s infinite alternate;
}

.neuron::before,
.neuron::after {

    content: "";

    position: absolute;

    height: 1px;

    background: rgba(130,210,255,.3);

    transform-origin: left center;
}

.neuron::before {
    width: 100px;
    transform: rotate(25deg);
}

.neuron::after {
    width: 75px;
    transform: rotate(-35deg);
}

.n1 { top: 12%; left: 7%; }
.n2 { top: 28%; left: 18%; }
.n3 { top: 15%; right: 15%; }
.n4 { top: 42%; right: 7%; }
.n5 { bottom: 20%; left: 9%; }
.n6 { bottom: 10%; left: 43%; }
.n7 { bottom: 25%; right: 17%; }
.n8 { top: 65%; left: 5%; }
.n9 { top: 55%; right: 10%; }
.n10 { top: 8%; left: 53%; }

@keyframes pulse {

    from {
        opacity: .25;
        transform: scale(.8);
    }

    to {
        opacity: 1;
        transform: scale(1.25);
    }
}


/* =====================================================
   JOGO
===================================================== */

.game {

    position: relative;

    z-index: 5;

    width: 720px;
    max-width: 90vw;

    min-height: 560px;

    padding: 25px 35px;

    background: rgba(248,249,251,.98);

    border-radius: 22px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.45);
}


/* =====================================================
   CABEÇALHO
===================================================== */

.header {

    display: flex;

    justify-content: space-between;

    align-items: center;
}

.logo {

    display: flex;

    align-items: center;

    gap: 10px;
}

.logo-icon {

    font-size: 31px;
}

.logo h1 {

    color: #173b69;

    font-size: 22px;
}

.logo p {

    color: #777;

    font-size: 11px;

    margin-top: 3px;
}


/* =====================================================
   ESTATÍSTICAS
===================================================== */

.stats {

    display: flex;

    gap: 6px;
}

.stat {

    background: #edf2f8;

    color: #173b69;

    padding: 7px 10px;

    border-radius: 8px;

    font-size: 12px;

    font-weight: bold;
}


/* =====================================================
   PROGRESSO
===================================================== */

.info {

    display: flex;

    justify-content: space-between;

    margin-top: 16px;

    color: #173b69;

    font-size: 11px;

    font-weight: bold;
}

.progress {

    height: 6px;

    background: #dce1e7;

    border-radius: 10px;

    margin-top: 6px;

    overflow: hidden;
}

.progress-bar {

    width: 0%;

    height: 100%;

    background: #3170a5;

    transition: .4s;
}


/* =====================================================
   ÁREA DO FLASHCARD
===================================================== */

.card-area {

    height: 285px;

    margin-top: 18px;

    perspective: 1200px;
}


.flashcard {

    width: 100%;
    height: 100%;

    position: relative;

    transform-style: preserve-3d;

    transition:
        transform .8s
        cubic-bezier(.65,.05,.36,1);

    cursor: pointer;
}

.flashcard.flipped {

    transform: rotateY(-180deg);
}


.card {

    position: absolute;

    inset: 0;

    border-radius: 17px;

    backface-visibility: hidden;

    -webkit-backface-visibility: hidden;
}


/* =====================================================
   FRENTE
===================================================== */

.front {

    background: white;

    border: 2px solid #3170a5;

    box-shadow:
        0 10px 25px rgba(0,0,0,.15);

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 30px;
}


.front-label {

    position: absolute;

    top: 17px;

    left: 20px;

    color: #7b8ca2;

    font-size: 9px;

    letter-spacing: 2px;

    font-weight: bold;
}


.word-label {

    color: #7b8ca2;

    font-size: 11px;

    margin-bottom: 18px;

    text-transform: uppercase;

    letter-spacing: 1px;
}


.sentence {

    color: #152f50;

    font-size: 25px;

    line-height: 1.45;

    font-weight: bold;

    max-width: 620px;
}


/* palavra em destaque */

.sentence strong {

    color: #2670a7;

    text-decoration: underline;

    text-decoration-thickness: 2px;

    text-underline-offset: 4px;
}


.flip-hint {

    margin-top: 22px;

    padding: 8px 16px;

    background: #e8f0f8;

    color: #3170a5;

    border-radius: 20px;

    font-size: 10px;

    font-weight: bold;
}


/* =====================================================
   VERSO
===================================================== */

.back {

    background:
        linear-gradient(
            135deg,
            #174776,
            #0c3158
        );

    border: 2px solid #4e82b8;

    color: white;

    transform: rotateY(180deg);

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 30px;
}


.answer-icon {

    font-size: 35px;

    margin-bottom: 8px;
}


.answer-label {

    color: #a9c6e4;

    font-size: 10px;

    letter-spacing: 2px;

    font-weight: bold;

    margin-bottom: 15px;
}


.answer {

    font-size: 30px;

    font-weight: bold;

    color: white;
}


.answer-example {

    margin-top: 12px;

    color: #b9d6ed;

    font-size: 12px;
}


/* =====================================================
   MENSAGEM
===================================================== */

.message {

    height: 20px;

    margin-top: 9px;

    text-align: center;

    font-size: 12px;

    font-weight: bold;
}

.good {
    color: #239765;
}

.bad {
    color: #c94c57;
}


/* =====================================================
   BOTÕES
===================================================== */

.buttons {

    display: flex;

    gap: 10px;

    margin-top: 5px;
}


button {

    border: none;

    border-radius: 9px;

    padding: 11px;

    font-size: 12px;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;
}


button:hover {

    transform: translateY(-2px);
}


.wrong {

    flex: 1;

    background: #d6535d;

    color: white;
}


.correct {

    flex: 1;

    background: #2c9a6d;

    color: white;
}


.next {

    display: none;

    width: 100%;

    margin-top: 8px;

    background: #3170a5;

    color: white;
}


/* =====================================================
   FINAL
===================================================== */

.final {

    display: none;

    text-align: center;

    padding-top: 70px;
}


.final-icon {

    font-size: 60px;
}


.final h2 {

    color: #173b69;

    font-size: 29px;

    margin-top: 12px;
}


.final p {

    color: #777;

    margin-top: 6px;
}


.final-score {

    margin: 20px auto;

    color: #3170a5;

    font-size: 16px;

    line-height: 1.8;
}


.restart {

    background: #3170a5;

    color: white;

    padding: 11px 25px;
}


/* =====================================================
   CELULAR
===================================================== */

@media(max-width: 650px) {

    body {

        overflow: auto;
    }

    .game {

        width: 94vw;

        padding: 18px;

    }

    .header {

        flex-direction: column;

        gap: 10px;
    }

    .card-area {

        height: 310px;
    }

    .sentence {

        font-size: 20px;
    }

    .answer {

        font-size: 25px;
    }

    .buttons {

        flex-direction: column;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     FUNDO
===================================================== -->

<div class="background">

    <div class="glow glow1"></div>
    <div class="glow glow2"></div>
    <div class="glow glow3"></div>

    <div class="neuron n1"></div>
    <div class="neuron n2"></div>
    <div class="neuron n3"></div>
    <div class="neuron n4"></div>
    <div class="neuron n5"></div>
    <div class="neuron n6"></div>
    <div class="neuron n7"></div>
    <div class="neuron n8"></div>
    <div class="neuron n9"></div>
    <div class="neuron n10"></div>

</div>


<!-- =====================================================
     JOGO
===================================================== -->

<div class="game">


    <div id="game">


        <!-- CABEÇALHO -->

        <div class="header">

            <div class="logo">

                <div class="logo-icon">
                    🌎
                </div>

                <div>

                    <h1>
                        Flashcards de Inglês
                    </h1>

                    <p>
                        Descubra o significado das palavras!
                    </p>

                </div>

            </div>


            <div class="stats">

                <div class="stat">
                    ⭐ <span id="points">0</span>
                </div>

                <div class="stat">
                    ❤️ <span id="lives">❤️❤️❤️</span>
                </div>

                <div class="stat">
                    🔥 <span id="streak">0</span>
                </div>

            </div>

        </div>


        <!-- PROGRESSO -->

        <div class="info">

            <span id="questionNumber">
                Pergunta 1 de 23
            </span>

            <span>
                Progresso
            </span>

        </div>


        <div class="progress">

            <div
                class="progress-bar"
                id="progressBar">
            </div>

        </div>


        <!-- FLASHCARD -->

        <div class="card-area">

            <div
                class="flashcard"
                id="flashcard">


                <!-- FRENTE -->

                <div class="card front">

                    <div class="front-label">
                        ENGLISH FLASHCARD
                    </div>


                    <div
                        class="word-label"
                        id="wordLabel">

                        QUAL É O SIGNIFICADO?

                    </div>


                    <div
                        class="sentence"
                        id="sentence">

                    </div>


                    <div class="flip-hint">
                        👆 Clique para virar o cartão
                    </div>

                </div>


                <!-- VERSO -->

                <div class="card back">

                    <div class="answer-icon">
                        💡
                    </div>


                    <div class="answer-label">
                        SIGNIFICADO EM PORTUGUÊS
                    </div>


                    <div
                        class="answer"
                        id="answer">

                    </div>


                    <div
                        class="answer-example"
                        id="answerExample">

                    </div>

                </div>

            </div>

        </div>


        <!-- MENSAGEM -->

        <div
            class="message"
            id="message">
        </div>


        <!-- BOTÕES -->

        <div
            class="buttons"
            id="buttons">

            <button
                class="wrong"
                onclick="answer(false)">

                ❌ Eu errei

            </button>


            <button
                class="correct"
                onclick="answer(true)">

                ✅ Eu acertei

            </button>

        </div>


        <!-- PRÓXIMO -->

        <button
            class="next"
            id="nextButton"
            onclick="nextCard()">

            Próximo flashcard →

        </button>


    </div>


    <!-- =================================================
         FINAL
    ================================================= -->

    <div
        class="final"
        id="final">

        <div class="final-icon">
            🏆
        </div>

        <h2>
            Parabéns!
        </h2>

        <p>
            Você terminou todos os flashcards de Inglês!
        </p>

        <div
            class="final-score"
            id="finalScore">
        </div>

        <button
            class="restart"
            onclick="restartGame()">

            🔄 Jogar novamente

        </button>

    </div>

</div>


<script>

/* =====================================================
   FLASHCARDS
===================================================== */

const cards = [

    {
        word: "fish",
        sentence: 'I like to eat <strong>fish</strong> for dinner.',
        answer: "Peixe"
    },

    {
        word: "juice",
        sentence: 'I drink orange <strong>juice</strong> every morning.',
        answer: "Suco"
    },

    {
        word: "omelette",
        sentence: 'My mother made an <strong>omelette</strong> for breakfast.',
        answer: "Omelete"
    },

    {
        word: "butter",
        sentence: 'I put <strong>butter</strong> on my bread.',
        answer: "Manteiga"
    },

    {
        word: "salad",
        sentence: 'I eat a healthy <strong>salad</strong> for lunch.',
        answer: "Salada"
    },

    {
        word: "sofa",
        sentence: 'I am sitting on the <strong>sofa</strong> watching TV.',
        answer: "Sofá"
    },

    {
        word: "chairs",
        sentence: 'There are four <strong>chairs</strong> around the table.',
        answer: "Cadeiras"
    },

    {
        word: "books",
        sentence: 'There are many <strong>books</strong> on my desk.',
        answer: "Livros"
    },

    {
        word: "fridge",
        sentence: 'The milk is inside the <strong>fridge</strong>.',
        answer: "Geladeira"
    },

    {
        word: "football",
        sentence: 'I play <strong>football</strong> with my friends on Sunday.',
        answer: "Futebol"
    },

    {
        word: "ice hockey",
        sentence: 'My brother loves playing <strong>ice hockey</strong>.',
        answer: "Hóquei de gelo"
    },

    {
        word: "skiing",
        sentence: 'We go <strong>skiing</strong> during the winter.',
        answer: "Esqui"
    },

    {
        word: "basketball",
        sentence: 'I play <strong>basketball</strong> at school.',
        answer: "Basquete"
    },

    {
        word: "surfing",
        sentence: 'They are <strong>surfing</strong> at the beach.',
        answer: "Surfe"
    },

    {
        word: "martial arts",
        sentence: 'He practices <strong>martial arts</strong> every week.',
        answer: "Artes marciais"
    },

    {
        word: "fishing",
        sentence: 'My grandfather enjoys <strong>fishing</strong> on weekends.',
        answer: "Pesca"
    },

    {
        word: "cycling",
        sentence: 'I like <strong>cycling</strong> with my friends.',
        answer: "Ciclismo"
    },

    {
        word: "police station",
        sentence: 'The police officer works at the <strong>police station</strong>.',
        answer: "Delegacia de polícia"
    },

    {
        word: "museum",
        sentence: 'We visited the <strong>museum</strong> yesterday.',
        answer: "Museu"
    },

    {
        word: "bookshop",
        sentence: 'I bought a new book at the <strong>bookshop</strong>.',
        answer: "Livraria"
    },

    {
        word: "library",
        sentence: 'I borrowed a book from the <strong>library</strong>.',
        answer: "Biblioteca"
    },

    {
        word: "department",
        sentence: 'My mother works in the sales <strong>department</strong>.',
        answer: "Departamento"
    },

    {
        word: "university",
        sentence: 'My sister studies at the <strong>university</strong>.',
        answer: "Universidade"
    }

];


/* =====================================================
   VARIÁVEIS
===================================================== */

let current = 0;

let points = 0;

let lives = 3;

let streak = 0;

let answered = false;


/* =====================================================
   MOSTRAR CARTA
===================================================== */

function showCard() {

    const card = cards[current];


    document.getElementById("sentence").innerHTML =
        card.sentence;


    document.getElementById("answer").textContent =
        card.answer;


    document.getElementById("wordLabel").textContent =
        `O que significa "${card.word}"?`;


    document.getElementById("answerExample").textContent =
        `A palavra destacada é: ${card.word}`;


    document.getElementById("questionNumber").textContent =
        `Pergunta ${current + 1} de ${cards.length}`;


    document.getElementById("points").textContent =
        points;


    document.getElementById("streak").textContent =
        streak;


    document.getElementById("progressBar").style.width =
        ((current / cards.length) * 100) + "%";


    updateLives();


    document.getElementById("flashcard")
        .classList.remove("flipped");


    document.getElementById("buttons")
        .style.display = "flex";


    document.getElementById("nextButton")
        .style.display = "none";


    document.getElementById("message")
        .textContent = "";


    document.getElementById("message")
        .className = "message";


    answered = false;

}


/* =====================================================
   VIDAS
===================================================== */

function updateLives() {

    let text = "";

    for (let i = 0; i < 3; i++) {

        text += i < lives
            ? "❤️"
            : "🖤";

    }

    document.getElementById("lives")
        .textContent = text;
}


/* =====================================================
   VIRAR FLASHCARD
===================================================== */

document.getElementById("flashcard")
    .addEventListener("click", function() {

        this.classList.toggle("flipped");

    });


/* =====================================================
   ACERTOU / ERROU
===================================================== */

function answer(correct) {

    if (answered) return;

    answered = true;


    if (correct) {

        points += 100;

        streak++;


        if (streak >= 3) {

            points += 50;

        }


        document.getElementById("message")
            .textContent =
            streak >= 3
                ? "🔥 COMBO! +150 pontos!"
                : "🎉 Acertou! +100 pontos!";


        document.getElementById("message")
            .classList.add("good");

    }


    else {

        lives--;

        streak = 0;


        document.getElementById("message")
            .textContent =
            "❌ Tudo bem! Confira o significado.";


        document.getElementById("message")
            .classList.add("bad");

    }


    document.getElementById("points")
        .textContent = points;


    document.getElementById("streak")
        .textContent = streak;


    updateLives();


    document.getElementById("flashcard")
        .classList.add("flipped");


    document.getElementById("buttons")
        .style.display = "none";


    document.getElementById("nextButton")
        .style.display = "block";

}


/* =====================================================
   PRÓXIMO FLASHCARD
===================================================== */

function nextCard() {

    current++;


    if (current >= cards.length) {

        finishGame();

        return;

    }


    showCard();

}


/* =====================================================
   FINAL DO JOGO
===================================================== */

function finishGame() {

    document.getElementById("game")
        .style.display = "none";


    document.getElementById("final")
        .style.display = "block";


    const maxPoints = cards.length * 100;

    const percentage = Math.min(
        100,
        Math.round((points / maxPoints) * 100)
    );


    document.getElementById("finalScore")
        .innerHTML =

        `⭐ Pontuação: <strong>${points}</strong><br>
         🎯 Aproveitamento: <strong>${percentage}%</strong><br>
         ❤️ Vidas restantes: <strong>${lives}</strong>`;

}


/* =====================================================
   REINICIAR
===================================================== */

function restartGame() {

    current = 0;

    points = 0;

    lives = 3;

    streak = 0;


    document.getElementById("game")
        .style.display = "block";


    document.getElementById("final")
        .style.display = "none";


    showCard();

}


/* =====================================================
   INICIAR
===================================================== */

showCard();

</script>

</body>

</html>
