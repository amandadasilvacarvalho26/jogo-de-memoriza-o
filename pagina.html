
<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escolha sua matéria</title>

<style>

/* =====================================================
   CONFIGURAÇÕES
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

    background: #07345d;
    color: white;
}


/* =====================================================
   FUNDO
===================================================== */

.background {
    position: fixed;
    inset: 0;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(54,133,190,.35),
            transparent 30%
        ),

        radial-gradient(
            circle at 15% 70%,
            rgba(35,105,165,.25),
            transparent 30%
        ),

        radial-gradient(
            circle at 85% 60%,
            rgba(35,105,165,.25),
            transparent 30%
        ),

        #07345d;
}


/* =====================================================
   BRILHOS
===================================================== */

.glow {
    position: absolute;

    width: 260px;
    height: 260px;

    border-radius: 50%;

    background: rgba(93,184,255,.13);

    filter: blur(50px);

    animation: glowMove 7s infinite alternate ease-in-out;
}

.glow1 {
    top: -100px;
    left: -80px;
}

.glow2 {
    right: -100px;
    top: 35%;

    animation-delay: 2s;
}

.glow3 {
    bottom: -120px;
    left: 40%;

    animation-delay: 4s;
}

@keyframes glowMove {

    from {
        transform: scale(.8);
        opacity: .4;
    }

    to {
        transform: scale(1.3);
        opacity: .8;
    }
}


/* =====================================================
   PARTÍCULAS
===================================================== */

.star {
    position: absolute;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: #bfe7ff;

    box-shadow:
        0 0 6px #9edbff,
        0 0 14px rgba(100,190,255,.8);

    animation: starPulse 3s infinite alternate;
}

@keyframes starPulse {

    from {
        opacity: .2;
        transform: scale(.7);
    }

    to {
        opacity: 1;
        transform: scale(1.4);
    }
}

.s1 { top: 13%; left: 9%; }
.s2 { top: 22%; left: 27%; }
.s3 { top: 10%; right: 13%; }
.s4 { top: 36%; right: 7%; }
.s5 { top: 67%; left: 8%; }
.s6 { top: 78%; right: 14%; }
.s7 { bottom: 9%; left: 30%; }
.s8 { top: 54%; left: 18%; }
.s9 { top: 48%; right: 23%; }
.s10 { bottom: 18%; right: 38%; }


/* =====================================================
   NEURÔNIOS
===================================================== */

.neuron {
    position: absolute;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #8bd2ff;

    box-shadow:
        0 0 8px #8bd2ff,
        0 0 18px rgba(80,180,255,.8);

    animation: neuronPulse 4s infinite alternate;
}

.neuron::before,
.neuron::after {
    content: "";

    position: absolute;

    height: 2px;

    background: rgba(111,201,255,.3);

    transform-origin: left center;
}

.neuron::before {
    width: 100px;
    transform: rotate(28deg);
}

.neuron::after {
    width: 75px;
    transform: rotate(-35deg);
}

@keyframes neuronPulse {

    from {
        opacity: .25;
        transform: scale(.8);
    }

    to {
        opacity: .9;
        transform: scale(1.25);
    }
}

.n1 { top: 20%; left: 7%; }
.n2 { top: 32%; left: 22%; }
.n3 { top: 16%; right: 21%; }
.n4 { top: 39%; right: 7%; }
.n5 { bottom: 24%; left: 10%; }
.n6 { bottom: 13%; left: 44%; }
.n7 { bottom: 27%; right: 17%; }
.n8 { top: 65%; left: 4%; }
.n9 { top: 58%; right: 8%; }
.n10 { top: 8%; left: 52%; }


/* =====================================================
   CONTEÚDO
===================================================== */

.container {
    position: relative;
    z-index: 5;

    width: 100%;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding-top: 85px;
}


/* =====================================================
   TÍTULO
===================================================== */

.title {
    font-size: clamp(38px, 5vw, 62px);

    font-weight: 900;

    color: white;

    text-align: center;

    letter-spacing: -2px;

    text-shadow:
        0 3px 0 #174c7a,
        0 6px 15px rgba(0,0,0,.35);

    animation: titleFloat 4s infinite ease-in-out;
}

@keyframes titleFloat {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-5px);
    }
}


.subtitle {
    margin-top: 10px;

    color: #b9dcf5;

    font-size: 15px;

    letter-spacing: 1px;
}


/* =====================================================
   ÁREA DAS MATÉRIAS
===================================================== */

.subjects {

    display: flex;

    justify-content: center;
    align-items: flex-start;

    gap: 55px;

    margin-top: 42px;
}


/* =====================================================
   CADA MATÉRIA
===================================================== */

.subject-box {

    position: relative;

    width: 205px;

    display: flex;
    flex-direction: column;
    align-items: center;
}


/* =====================================================
   BOTÃO PRINCIPAL
===================================================== */

.subject {

    width: 205px;
    height: 68px;

    border: none;

    border-radius: 9px;

    background: #205a80;

    color: white;

    font-size: 20px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        0 8px 18px rgba(0,0,0,.25);

    transition:
        transform .25s,
        background .25s,
        box-shadow .25s;

    position: relative;

    z-index: 10;
}


.subject:hover {

    background: #28698f;

    transform: translateY(-3px);

    box-shadow:
        0 10px 25px rgba(0,0,0,.35),
        0 0 20px rgba(72,170,225,.18);
}


.subject:active {
    transform: scale(.98);
}


/* linha brilhante no botão */

.subject::before {

    content: "";

    position: absolute;

    top: 0;
    left: 10px;
    right: 10px;

    height: 2px;

    background: rgba(255,255,255,.18);

    border-radius: 20px;
}


/* seta */

.arrow {

    display: inline-block;

    margin-left: 7px;

    font-size: 13px;

    transition: transform .3s;
}


/* =====================================================
   MENU SUSPENSO
===================================================== */

.menu {

    width: 288px;

    background: #174e73;

    border-radius: 0 0 12px 12px;

    padding: 10px;

    position: absolute;

    top: 63px;

    left: 50%;

    transform: translateX(-50%) translateY(-10px);

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    box-shadow:
        0 15px 30px rgba(0,0,0,.35);

    transition:
        opacity .25s ease,
        transform .25s ease,
        visibility .25s;

    z-index: 20;
}


/* quando estiver aberto */

.subject-box.open .menu {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;

    transform: translateX(-50%) translateY(0);

}


/* seta vira */

.subject-box.open .arrow {

    transform: rotate(180deg);

}


/* =====================================================
   ITENS DO MENU
===================================================== */

.menu-item {

    width: 100%;

    height: 52px;

    border: none;

    border-radius: 9px;

    margin-bottom: 7px;

    background: #205d82;

    color: white;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    transition:
        background .2s,
        transform .2s;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05);
}


.menu-item:last-child {
    margin-bottom: 0;
}


.menu-item:hover {

    background: #2c7299;

    transform: translateX(3px);

}


/* =====================================================
   ÁREA INFERIOR
===================================================== */

.bottom-area {

    position: absolute;

    bottom: 35px;

    display: flex;

    gap: 12px;
}


.info-box {

    padding: 9px 18px;

    background: rgba(17,71,107,.65);

    border: 1px solid rgba(129,202,244,.12);

    border-radius: 8px;

    color: #a8cee7;

    font-size: 11px;

}


/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width: 850px) {

    body {
        overflow-y: auto;
    }

    .container {
        padding-top: 60px;
        padding-bottom: 100px;
    }

    .subjects {

        gap: 25px;

        flex-wrap: wrap;

        width: 90%;

    }

    .bottom-area {

        position: relative;

        bottom: auto;

        margin-top: 80px;

        flex-wrap: wrap;

        justify-content: center;

    }

}


@media(max-width: 600px) {

    .title {
        font-size: 38px;
    }

    .subtitle {
        font-size: 12px;
    }

    .subjects {

        flex-direction: column;

        align-items: center;

        margin-top: 30px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     FUNDO
===================================================== -->

<div class="background">

    <div class="glow glow1"></div>
    <div class="glow glow2"></div>
    <div class="glow glow3"></div>

    <div class="neuron n1"></div>
    <div class="neuron n2"></div>
    <div class="neuron n3"></div>
    <div class="neuron n4"></div>
    <div class="neuron n5"></div>
    <div class="neuron n6"></div>
    <div class="neuron n7"></div>
    <div class="neuron n8"></div>
    <div class="neuron n9"></div>
    <div class="neuron n10"></div>

    <div class="star s1"></div>
    <div class="star s2"></div>
    <div class="star s3"></div>
    <div class="star s4"></div>
    <div class="star s5"></div>
    <div class="star s6"></div>
    <div class="star s7"></div>
    <div class="star s8"></div>
    <div class="star s9"></div>
    <div class="star s10"></div>

</div>


<!-- =====================================================
     CONTEÚDO
===================================================== -->

<main class="container">


    <h1 class="title">
        Escolha a sua matéria
    </h1>


    <p class="subtitle">
        Escolha um desafio e teste seus conhecimentos!
    </p>


    <!-- =================================================
         MATÉRIAS
    ================================================= -->

    <div class="subjects">


        <!-- ================= PORTUGUÊS ================= -->

        <div class="subject-box">

            <button
                class="subject"
                onclick="toggleMenu(this.parentElement)">

                📚 Português

                <span class="arrow">▼</span>

            </button>


            <div class="menu">

                <button
                    class="menu-item"
                    onclick="abrirJogo('sintaxe.html')">

                    Sintaxe

                </button>


                <button
                    class="menu-item"
                    onclick="abrirJogo('gramatica.html')">

                    Redação

                </button>


                <button
                    class="menu-item"
                    onclick="abrirJogo('literatura.html')">

                    Literatura

                </button>

            </div>

        </div>


        <!-- ================= INGLÊS ================= -->

        <div class="subject-box">

            <button
                class="subject"
                onclick="toggleMenu(this.parentElement)">

                🌎 Inglês

                <span class="arrow">▼</span>

            </button>


            <div class="menu">

                <button
                    class="menu-item"
                    onclick="abrirJogo('vocabulario.html')">

                    Vocabulário

                </button>


                <button
                    class="menu-item"
                    onclick="abrirJogo('ingles-gramatica.html')">

                    Gramática

                </button>


                <button
                    class="menu-item"
                    onclick="abrirJogo('ingles-verbos.html')">

                    Verbos

                </button>

            </div>

        </div>


        <!-- ================= BIOLOGIA ================= -->

        <div class="subject-box">

            <button
                class="subject"
                onclick="toggleMenu(this.parentElement)">

                🧬 Biologia

                <span class="arrow">▼</span>

            </button>


            <div class="menu">

                <button
                    class="menu-item"
                    onclick="abrirJogo('embriologia.html')">

                    Embriologia

                </button>


                <button
                    class="menu-item"
                    onclick="abrirJogo('genetica.html')">

                    Genética

                </button>


                <button
                    class="menu-item"
                    onclick="abrirJogo('corpo-humano.html')">

                    Corpo Humano

                </button>

            </div>

        </div>


    </div>


    <!-- =================================================
         PARTE INFERIOR
    ================================================= -->

    <div class="bottom-area">

        <div class="info-box">
            🧠 Aprenda jogando
        </div>

        <div class="info-box">
            ⭐ Ganhe pontos
        </div>

        <div class="info-box">
            🔥 Aumente seu combo
        </div>

    </div>


</main>


<script>

/* =====================================================
   ABRIR / FECHAR MENU
===================================================== */

function toggleMenu(box) {

    /*
       Fecha todos os outros menus
    */

    document.querySelectorAll(".subject-box")
        .forEach(function(item) {

            if (item !== box) {

                item.classList.remove("open");

            }

        });


    /*
       Abre ou fecha o menu clicado
    */

    box.classList.toggle("open");

}


/* =====================================================
   ABRIR JOGO
===================================================== */

function abrirJogo(pagina) {

    window.location.href = pagina;

}


/* =====================================================
   FECHAR AO CLICAR FORA
===================================================== */

document.addEventListener("click", function(event) {

    if (!event.target.closest(".subject-box")) {

        document.querySelectorAll(".subject-box")
            .forEach(function(box) {

                box.classList.remove("open");

            });

    }

});

</script>


</body>

</html>
